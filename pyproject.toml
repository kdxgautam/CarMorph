[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "car-paint"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.140.13",
    "starlette==0.50.0",
    "numpy==2.3.5",
    "opencv-python==4.10.0.84",
    "Pillow==12.3.0",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "google-genai==1.72.0",
    "streamlit==1.60.0",
    "ultralytics==8.4.110",
    "clip @ git+https://github.com/ultralytics/CLIP.git@c4b6ea0932a2c0f39a0fa528af5ec4982ff15cab",
    "uvicorn==0.52.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
